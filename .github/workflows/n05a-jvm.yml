name: N05A Shared Kotlin JVM contracts and staged Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n05a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact library source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify shared source and boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_source.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate official Gradle wrapper and cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
      - name: Compile and run JVM tests; stage Maven artifacts locally
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean test publishSharedCorePublicationToStagingRepository
      - name: Check hosted test results and source-bound Maven bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_publication.py
      - name: Upload test XML, staging artifact and SHA receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-shared-n05a-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            build/test-results/test/
            build/staging-maven/
            build/n05a-staging-receipt.json
          if-no-files-found: warn
          retention-days: 14
